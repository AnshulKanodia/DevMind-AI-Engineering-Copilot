apiVersion: v1
kind: Service
metadata:
  name: devmind-backend
  namespace: devmind
  labels:
    app.kubernetes.io/name: devmind-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: devmind-backend
