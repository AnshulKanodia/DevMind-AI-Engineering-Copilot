apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devmind-ingress
  namespace: devmind
  labels:
    app.kubernetes.io/name: devmind-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  tls:
    - hosts:
        - devmind.example.com
      secretName: devmind-tls-cert
  rules:
    - host: devmind.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devmind-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devmind-frontend
                port:
                  number: 3000
