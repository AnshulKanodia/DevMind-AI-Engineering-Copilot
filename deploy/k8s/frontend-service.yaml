apiVersion: v1
kind: Service
metadata:
  name: devmind-frontend
  namespace: devmind
  labels:
    app.kubernetes.io/name: devmind-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: devmind-frontend
