[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devmind-backend"
version = "0.1.0"
description = "DevMind AI Engineering Copilot Backend API & LangGraph Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DevMind Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "motor>=3.3.2",
    "pymongo>=4.6.2",
    "redis>=5.0.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "black>=24.3.0",
]
